<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Most Valuable AI Skill Is Saying No</title>
<!--
  THE TITLE FILM: "Four gates". 46 seconds. The MP4s carry its sound; this
  page is the picture only (the sound is built by tools/build-audio.js from
  the same score, video/score.js).

    title.html                     1920 x 1080
    title.html?size=1080x1080      the square re-layout, for social posts
    title.html?t=12.5              frozen on the frame at 12.5 seconds

  Space pauses, R replays, the arrow keys step one beat.
  Render:  node tools/render-video.js video/title.html   (see video/README.md)

  Everything the film needs is in this folder (fonts.css is a copy of the
  deck's), except the speaker's details, read from deck/content/your-numbers.js
  when it is there. Classic scripts, relative paths, no network.
-->
<link rel="stylesheet" href="fonts.css">
<style>
:root {
  --card: #F4EDDE;        /* the ground */
  --lampblack: #050505;   /* the ink */
  --flare: #FF6842;       /* the point: once per frame */
  --voice-settings: "opsz" 72, "SOFT" 0, "WONK" 0;
}
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--lampblack); }

.film {
  position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0;
  background: var(--card); color: var(--lampblack);
  font-family: "Archivo", sans-serif; font-weight: 500; font-stretch: 100%;
  font-synthesis: none; font-kerning: normal; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  user-select: none;
}
:where(.film *) { margin: 0; padding: 0; box-sizing: border-box; font-style: normal; font-weight: inherit; }
.film .a { position: absolute; }
.sc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: var(--card); }

.ink { background: var(--lampblack); }
.card { background: var(--card); }
.flare { background: var(--flare); }

/* the four hands */
.t-display {
  font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 62%;
  line-height: 0.708; letter-spacing: 0; text-transform: uppercase; white-space: nowrap;
}
.t-label {
  font-family: "Archivo", sans-serif; font-size: 32px; font-weight: 700; font-stretch: 125%;
  line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.t-voice {
  font-family: "Fraunces", serif; font-style: italic; font-weight: 600; font-stretch: normal;
  font-variation-settings: var(--voice-settings); font-optical-sizing: none; letter-spacing: 0; white-space: nowrap;
}
.t-say {
  font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 100%;
  line-height: 1.04; letter-spacing: -0.012em; white-space: nowrap;
}
.ln { display: block; width: max-content; white-space: nowrap; }
.bar { position: absolute; left: 0; background: var(--lampblack); }
.strike { position: absolute; left: 0; background: var(--lampblack); transform-origin: 0 50%; }

/* the gate */
.shut { overflow: hidden; background: var(--lampblack); color: var(--card); }
.shut.is-no { background: var(--flare); color: var(--lampblack); }
.arrow {
  background: var(--lampblack);
  clip-path: polygon(0 calc(50% - var(--aw) / 2), calc(100% - var(--aw) * 5) calc(50% - var(--aw) / 2), calc(100% - var(--aw) * 5) 0,
    100% 50%, calc(100% - var(--aw) * 5) 100%, calc(100% - var(--aw) * 5) calc(50% + var(--aw) / 2), 0 calc(50% + var(--aw) / 2));
}
.micro { line-height: 1.12; letter-spacing: 0.06em; }

/* the idea */
.crate { background: var(--lampblack); color: var(--card); overflow: hidden; }
.crate.is-winner { background: var(--flare); color: var(--lampblack); }

/* the title card */
.lfield { background: var(--card); }
.lgroup { color: var(--lampblack); }
.spine { background: var(--lampblack); }
.slab { background: var(--flare); color: var(--lampblack); }
.fine .t-label { display: block; margin-bottom: 18px; }
.fine b { display: block; font-size: 58px; line-height: 0.92; }
.fine.is-s .t-label { margin-bottom: 12px; }
.fine.is-s b { font-size: 40px; }
.name { font-size: 48px; font-weight: 900; font-stretch: 100%; line-height: 1; letter-spacing: -0.005em; white-space: nowrap; }
.role { font-size: 36px; font-weight: 600; font-stretch: 75%; line-height: 1; white-space: nowrap; }
.is-negative .lfield { background: var(--lampblack); }
.is-negative .lgroup { color: var(--card); }
.is-negative .spine { background: var(--card); }

/* the replay control: outside the stage, never in a capture */
.film-ui {
  position: fixed; left: 16px; bottom: 16px; z-index: 10; display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: var(--card); color: var(--lampblack);
  font: 600 15px/1 "Archivo", sans-serif; visibility: hidden;
}
.film-ui button {
  appearance: none; border: 3px solid var(--lampblack); background: var(--lampblack); color: var(--card);
  padding: 9px 16px; font: 700 15px/1 "Archivo", sans-serif; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
}
.film-ui button:hover, .film-ui button:focus-visible { background: var(--card); color: var(--lampblack); outline: none; }
.film-ui-time { min-width: 86px; font-variant-numeric: tabular-nums; }
.is-awake .film-ui { visibility: visible; }
html:not(.is-awake) body { cursor: none; }
.is-capture .film-ui { display: none; }
</style>
</head>
<body>
<div id="film" class="film" aria-label="Title film: The Most Valuable AI Skill Is Saying No."></div>
<noscript>This film needs JavaScript. Open it in Chrome, Edge or Safari, or play title-sequence.mp4.</noscript>

<script src="score.js"></script>
<script src="../deck/content/your-numbers.js"></script>
<script src="title-sequence.js"></script>
</body>
</html>
